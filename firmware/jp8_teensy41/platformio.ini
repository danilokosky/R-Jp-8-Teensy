; ============================================================================
; PlatformIO Project Configuration — Roland Jupiter-8 Teensy 4.1 DSP Replica
; Compila localmente (pio run) ou na nuvem via GitHub Actions (.github/workflows)
; ============================================================================

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags =
  -std=gnu++17
  -O3
  -ffast-math
  -D USB_MIDI_AUDIO_SERIAL
  -D JP8_MAX_VOICES=8
  -D JP8_OVERSAMPLE=2
  -D JP8_USE_ZDF=1
  -D JP8_STEREO_PAN=1
lib_deps =
  PaulStoffregen/Audio
  fortyseveneffects/MIDI Library

[env:native_test]
platform = native
build_flags =
  -std=c++17
  -O2
  -Wall
  -Wextra
  -Werror
  -I include
  -D JP8_MAX_VOICES=8
  -D JP8_OVERSAMPLE=2
  -D JP8_USE_ZDF=1
