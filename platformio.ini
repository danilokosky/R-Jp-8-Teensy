; ============================================================================
; PlatformIO Project Configuration (Raiz do Repositório)
; Aponta automaticamente para os arquivos C++17 em firmware/jp8_teensy41/
; ============================================================================

[platformio]
src_dir = firmware/jp8_teensy41/src
include_dir = firmware/jp8_teensy41/include
test_dir = firmware/jp8_teensy41/test

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags =
  -std=gnu++17
  -O3
  -ffast-math
  -D USB_MIDI_AUDIO_SERIAL
  -D JP8_MAX_VOICES=8
  -D JP8_OVERSAMPLE=2
  -D JP8_USE_ZDF=1
  -D JP8_STEREO_PAN=1
lib_deps =
  PaulStoffregen/Audio
  fortyseveneffects/MIDI Library
  PaulStoffregen/USBHost_t36
  adafruit/Adafruit GFX Library
  PaulStoffregen/ILI9341_t3
