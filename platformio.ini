; ============================================================================
; PlatformIO Project Configuration (Raiz do Repositório)
; Aponta automaticamente para os arquivos C++17 em firmware/jp8_teensy41/
;
; NOTA IMPORTANTE SOBRE BIBLIOTECAS TEENSY (Teensyduino 1.62 / GCC 15.2):
;   As bibliotecas 'Audio', 'USBHost_t36', 'ILI9341_t3', 'SPI', 'SD', 'Wire' e 'SerialFlash'
;   JÁ VÊM EMBUTIDAS e atualizadas para Teensy 4.1 dentro do pacote oficial
;   'framework-arduinoteensy'. Não devem ser baixadas via lib_deps do registro antigo!
; ============================================================================

[platformio]
src_dir = firmware/jp8_teensy41/src
include_dir = firmware/jp8_teensy41/include
test_dir = firmware/jp8_teensy41/test

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags =
  -std=gnu++17
  -O3
  -ffast-math
  -D USB_MIDI_AUDIO_SERIAL
  -D JP8_MAX_VOICES=8
  -D JP8_OVERSAMPLE=2
  -D JP8_USE_ZDF=1
  -D JP8_STEREO_PAN=1
lib_deps =
  fortyseveneffects/MIDI Library@^5.0.2
